<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LMD – Luxury Meets Desires</title>
<meta name="theme-color" content="#1B1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ink:#1B1220;--plum:#2C1F38;--plum2:#3C2B4A;--gold:#C9A66B;--ivory:#F5EFE6;--mute:#A99DB5;--bad:#F0959A}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--ivory);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.2}
h1{font-size:30px;margin-bottom:8px}h3{font-size:21px}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px}
.brand{font-size:38px;color:var(--gold);letter-spacing:.06em}
.tag{color:var(--mute)}
.card{background:var(--plum);border:1px solid var(--plum2);border-radius:14px;padding:16px;margin:12px 0}
.card[data-act]{cursor:pointer}.card.lock{opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);white-space:nowrap}
button{font:inherit;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;width:100%}
button.ghost{background:transparent;color:var(--ivory);border:1px solid var(--plum2);margin-top:10px}
button:disabled{opacity:.5;cursor:default}
label{display:block;color:var(--mute);font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:12px;margin:6px 0 14px;background:var(--ink);color:var(--ivory);border:1px solid var(--plum2);border-radius:10px}
textarea{min-height:140px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--plum);border-top:1px solid var(--plum2);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--mute);border-radius:0;padding:17px 4px;margin:0}
nav button.on{color:var(--gold)}
.msg{color:var(--gold);margin:10px 0}.msg.err{color:var(--bad)}
pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--gold);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90%;display:none}
#toast.err{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://gbnulafgxdiczvffhlde.supabase.co';
const SB_KEY='sb_publishable_IULfH35cD2bKm3Hhkl9h8Q_EIenIwML';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rank={free:0,premium:1,pro:2};
const S={ready:false,user:null,profile:null,mem:null,items:[],tab:'library',mode:'login',msg:'',err:false,reading:null};

function isOwner(){return !!(S.profile&&S.profile.role==='owner')}
function effTier(){
  const m=S.mem;
  if(m&&m.tier!=='free'&&m.current_period_end&&new Date(m.current_period_end)>new Date()&&['active','cancelled'].includes(m.status))return m.tier;
  return 'free';
}
// Display only. The database enforces the real access rules.
function can(it){return isOwner()||rank[it.required_tier]<=rank[effTier()]}

function toast(msg,err){
  const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500);
}

async function refresh(){
  if(S.user){
    const u=S.user.id;
    const [p,m,i]=await Promise.all([
      sb.from('profiles').select('full_name,role').eq('id',u).maybeSingle(),
      sb.from('memberships').select('*').eq('user_id',u).maybeSingle(),
      sb.from('content_items').select('*').order('created_at',{ascending:false})
    ]);
    S.profile=p.data;S.mem=m.data;S.items=i.data||[];
  }else{S.profile=null;S.mem=null;S.items=[];S.reading=null;S.tab='library'}
  S.ready=true;render();
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(!['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev))return;
  const same=S.user&&session&&session.user.id===S.user.id&&S.profile;
  S.user=session?session.user:null;
  if(ev==='SIGNED_IN'&&same)return;
  setTimeout(refresh,0);
});

/* ---------- views ---------- */
function authView(){
  const su=S.mode==='signup';
  return `<div class="wrap"><div class="brand">LMD</div><p class="tag">Luxury Meets Desires</p>
  <h1 style="margin-top:28px">AI tools for South African small businesses</h1>
  <p class="tag">Prompts and templates you can use today. Start free.</p>
  <form id="authForm" style="margin-top:22px">
  ${su?'<label>Your name<input name="name" autocomplete="name" required></label>':''}
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>Password (6 or more characters)<input name="password" type="password" minlength="6" autocomplete="${su?'new-password':'current-password'}" required></label>
  <button>${su?'Create free account':'Log in'}</button></form>
  <p class="msg ${S.err?'err':''}">${esc(S.msg)}</p>
  <button class="ghost" data-act="mode">${su?'I already have an account':'Create a free account'}</button></div>`;
}

function libraryView(){
  if(S.reading){
    const r=S.reading;
    return `<div class="wrap"><button class="ghost" data-act="back" style="margin:0 0 16px">Back to library</button>
    <h1>${esc(r.it.title)}</h1><span class="pill">${cap(r.it.required_tier)}</span><pre>${esc(r.body)}</pre></div>`;
  }
  const list=S.items.map(it=>{
    const ok=can(it);
    return `<div class="card ${ok?'':'lock'}" data-act="open" data-id="${it.id}" role="button" tabindex="0">
    <div class="row"><h3>${esc(it.title)}</h3><span class="pill">${cap(it.required_tier)}</span></div>
    <p class="tag">${esc(it.summary||'')}</p>
    ${ok?'':'<p class="tag">Locked. Upgrade to read.</p>'}
    ${isOwner()&&!it.published?'<p class="tag">Draft. Only you can see this.</p>':''}</div>`;
  }).join('');
  return `<div class="wrap"><h1>Library</h1>${list||'<p class="tag">Nothing here yet. New content is added regularly.</p>'}</div>`;
}

function accountView(){
  const t=effTier(),m=S.mem||{};
  const end=(t!=='free'&&m.current_period_end)?new Date(m.current_period_end).toLocaleDateString('en-ZA'):'';
  const name=S.profile&&S.profile.full_name?S.profile.full_name:'';
  const plans=t==='free'?`
  <h2 style="margin-top:26px">Upgrade</h2>
  <div class="card"><div class="row"><h3>Premium</h3><span class="pill">R49 a month</span></div>
  <p class="tag">Or R499 a year. The full prompt library, plus new templates every month.</p>
  <button disabled style="margin-top:12px">Payments open soon</button></div>
  <div class="card"><div class="row"><h3>Pro</h3><span class="pill">R99 a month</span></div>
  <p class="tag">Everything in Premium, plus the complete toolkit and step-by-step guides.</p>
  <button disabled style="margin-top:12px">Payments open soon</button></div>`:'';
  return `<div class="wrap"><h1>Account</h1>
  <div class="card"><p>${esc(name)}</p><p class="tag">${esc(S.user.email)}</p>
  <p style="margin-top:10px">Plan: <span class="pill">${cap(t)}</span></p>
  ${end?`<p class="tag">${m.status==='cancelled'?'Access ends':'Paid until'} ${esc(end)}</p>`:''}
  ${isOwner()?'<p class="tag">Owner account</p>':''}</div>
  ${plans}<button class="ghost" data-act="logout">Log out</button></div>`;
}

function adminView(){
  const rows=S.items.map(it=>`<div class="card"><div class="row"><div><h3>${esc(it.title)}</h3>
  <p class="tag">${cap(it.required_tier)} · ${it.published?'Published':'Draft'}</p></div>
  <button data-act="pub" data-id="${it.id}" style="width:auto;padding:10px 14px">${it.published?'Unpublish':'Publish'}</button></div></div>`).join('');
  return `<div class="wrap"><h1>Add content</h1>
  <form id="addForm" class="card">
  <label>Title<input name="title" required></label>
  <label>Short summary<input name="summary"></label>
  <label>Who can read it<select name="tier"><option value="free">Free</option><option value="premium">Premium</option><option value="pro">Pro</option></select></label>
  <label>Content<textarea name="body" required></textarea></label>
  <label style="margin-bottom:14px"><input type="checkbox" name="pub">Publish now</label>
  <button>Save content</button></form>
  <h2 style="margin-top:24px">All content</h2>${rows||'<p class="tag">No content yet.</p>'}</div>`;
}

function render(){
  const nav=$('#nav');
  if(!S.ready){app.innerHTML='<div class="wrap"><p class="tag">Loading…</p></div>';nav.innerHTML='';return}
  if(!S.user){app.innerHTML=authView();nav.innerHTML='';return}
  let tab=S.tab;if(tab==='admin'&&!isOwner())tab='library';
  app.innerHTML=tab==='account'?accountView():tab==='admin'?adminView():libraryView();
  const tabs=[['library','Library'],['account','Account']];
  if(isOwner())tabs.push(['admin','Admin']);
  nav.innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-id="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
}

/* ---------- actions ---------- */
async function openItem(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  if(!can(it)){S.tab='account';S.reading=null;render();toast('That content needs '+cap(it.required_tier),true);return}
  const {data,error}=await sb.from('content_bodies').select('body').eq('content_id',id).maybeSingle();
  S.reading={it,body:error?'Could not load this content. Check your connection and try again.':(data?data.body:'No content has been added yet.')};
  render();window.scrollTo(0,0);
}

async function doAuth(f){
  const email=f.email.value.trim(),pw=f.password.value;
  S.msg='Please wait…';S.err=false;render();
  let error=null;
  if(S.mode==='signup'){
    const r=await sb.auth.signUp({email,password:pw,options:{data:{full_name:f.name.value.trim()}}});
    error=r.error;
    if(!error&&!r.data.session){S.msg='Account created. Check your email to confirm it, then log in.';S.mode='login';render();return}
  }else{
    error=(await sb.auth.signInWithPassword({email,password:pw})).error;
  }
  if(error){S.msg=error.message;S.err=true;render()}
}

async function addContent(f){
  const ins=await sb.from('content_items').insert({
    title:f.title.value.trim(),summary:f.summary.value.trim()||null,
    required_tier:f.tier.value,published:f.pub.checked}).select('id').single();
  if(ins.error){toast(ins.error.message,true);return}
  const b=await sb.from('content_bodies').insert({content_id:ins.data.id,body:f.body.value});
  if(b.error){toast(b.error.message,true);return}
  toast('Saved');await refresh();
}

document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='authForm')await doAuth(e.target);
  if(e.target.id==='addForm')await addContent(e.target);
});

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='tab'){S.tab=id;S.reading=null;render()}
  else if(a==='mode'){S.mode=S.mode==='login'?'signup':'login';S.msg='';render()}
  else if(a==='open')await openItem(id);
  else if(a==='back'){S.reading=null;render()}
  else if(a==='logout'){await sb.auth.signOut()}
  else if(a==='pub'){
    const it=S.items.find(x=>x.id===id);
    const r=await sb.from('content_items').update({published:!it.published}).eq('id',id);
    if(r.error)toast(r.error.message,true);else await refresh();
  }
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
